  en: Update Refused
  zh-CN: 更新被拒绝
error.refused_body:
  en: "The camera refused this package. Check that it supports your camera and firmware."
  zh-CN: "相机拒绝了此更新包。请确认更新包支持你的相机和固件版本。"
error.lost_title:
  en: Connection Lost
  zh-CN: 连接已断开
error.lost_body:
  en: "Reconnect to check the update status. The camera may still have a pending update."
  zh-CN: "请重新连接以检查更新状态。相机上可能仍有待处理的更新。"
error.pair_title:
  en: Pairing Needed
  zh-CN: 需要配对
error.pair_body:
  en: Complete pairing on the camera, then try again.
  zh-CN: 请先在相机上完成配对，然后重试。
error.wifi_title:
  en: Could Not Join Wi-Fi
  zh-CN: 无法加入 Wi-Fi
error.wifi_body:
  en: Allow the network prompt, keep the camera nearby, then try again.
  zh-CN: 请允许系统网络提示，保持相机在附近，然后重试。
error.card_ready_title:
  en: Camera Not Ready
  zh-CN: 相机未就绪
error.card_ready_body:
  en: The memory card is still starting. Try again in a moment.
  zh-CN: 存储卡仍在启动，请稍后再试。
error.bt_title:
  en: Bluetooth Unavailable
  zh-CN: 蓝牙不可用
