error.card_full_title:
  en: Card Is Full
  zh-CN: 存储卡已满
error.card_full_body:
  en: Free %{size}, then try again.
  zh-CN: 请先腾出 %{size}，然后重试。
error.not_confirmed_title:
  en: Not Confirmed
  zh-CN: 未确认
error.not_confirmed_body:
  en: "Confirmation timed out. Check the camera before trying again."
  zh-CN: "确认已超时。请先检查相机，再重试。"
